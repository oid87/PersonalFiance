name: Forward P/E series

# 跟 fetch.yml 分開的獨立排程 —— 這是新方法論的驗證期序列（見 docs/forward_pe.md），
# 跟既有的 fetch_spy_valuation.py / fetch_qqq_valuation.py 平行跑、互不影響。
# 比對一段時間確認無誤後才會把 valuation tab 切過來，屆時這支併回 fetch.yml。
on:
  schedule:
    # 05:00 UTC 週一–週五 = 13:00 台北 / 01:00 ET（美股收盤後）
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# 同一天重跑是 idempotent 的（覆蓋當日該筆），所以併發不會產生重複列；
# 但仍序列化以免兩個 job 同時 push 打架。
concurrency:
  group: forward-pe
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      # 兩個標的分開跑：VOO 約 500 檔、QQQ 約 100 檔，任一標的失敗不該拖垮另一個。
      # 序列跑（不 matrix）是刻意的 —— 併發打 yfinance 容易觸發 rate limit。
      - name: Fetch VOO forward P/E
        continue-on-error: true
        run: python scripts/fetch_forward_pe.py --ticker VOO --rows 0

      # QQQ 已於 2026-09-06 開始寫入序列。兩輪查證已窮盡免費來源，QQQ（NASDAQ-100）
      # 目前沒有可用的同日第三方 forward-NTM 基準（Invesco/worldperatio/Morningstar
      # 皆 trailing 口徑，iShares CNDX fact sheet 口徑自相矛盾，WSJ 已查明是日曆年
      # 口徑，其餘來源被擋或無 P/E 欄位），見 docs/forward_pe.md「已知限制」一節。
      # 目前僅有內部交叉檢查（slickcharts 指數權重 vs Nasdaq 市值權重，差 1.13%）
      # 與 FX/holdings 交叉比對，不是外部驗證——這是已知記錄在文件裡的限制，
      # 不再是暫緩寫入的理由。
      - name: Fetch QQQ forward P/E
        continue-on-error: true
        run: python scripts/fetch_forward_pe.py --ticker QQQ --rows 0

      - name: Commit updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forward_pe_*.jsonl data/chart_*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: forward P/E daily append [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi
