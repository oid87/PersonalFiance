name: Market risk lab weekly backtest

# 每週完整回測（訊號回測＋真實 ETF NAV＋walk-forward＋模型版本比對）。
# 不下載任何行情：只讀 fetch.yml 已提交的 data/*.json，避免重跑整套每日抓取。
# 輸入雜湊與模型版本都沒變 → backtest 腳本直接跳過、不寫檔、不 commit。
# 失敗不覆蓋：腳本例外時不寫檔，保留上次成功的 data/market_risk_lab_backtest.json。
on:
  schedule:
    # 02:00 UTC 週六 = 10:00 台北週六（週五美股、台股資料都已由 fetch.yml 更新）
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      force:
        description: "即使輸入與模型版本未變也重跑"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-risk-lab-weekly
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Engineering tests (market risk lab)
        run: python -m unittest discover -s scripts/tests -p 'test_market_risk_lab*.py'

      - name: Check source manifest
        run: python scripts/check_pipeline.py

      - name: Recompute current signals
        run: python scripts/compute_market_risk_lab.py

      - name: Full backtest
        run: python scripts/backtest_market_risk_lab.py --mode full ${{ inputs.force && '--force' || '' }}

      - name: Validate data
        run: python scripts/validate_data.py --no-shrink

      - name: Commit updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_risk_lab.json data/market_risk_lab_backtest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: market risk lab weekly backtest [skip ci]"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              [ "$i" -lt 3 ] && sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::git push failed after 3 attempts"; exit 1; }
          fi
