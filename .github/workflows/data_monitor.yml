name: Data monitor

# 每天早上（臺北 07:00，週二到週六＝前一個交易日的隔天）做兩件事：
# 1. 再抓一次「每 5 秒委託成交統計」。這個開放資料下載點只給最新一個交易日，前一晚沒抓到的話，
#    開盤前還有最後一次機會；過了就永久缺漏。已經有的日子不會重抓也不會覆蓋。
# 2. 用現在時間重新檢查各來源是不是落後、狀態檔是不是停了、正式站是不是沒跟上，
#    有問題就開或更新 Issue（標籤 data-alert），全部恢復就關閉。
on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Retry TW intraday replay (最新一個交易日，已有就略過)
        continue-on-error: true
        env:
          STEP_LOG: /tmp/pf_steps.jsonl
        run: python scripts/run_step.py -- python scripts/fetch_tw_intraday.py

      - name: Build data status (各資料來源的最新日期、落後與缺漏)
        continue-on-error: true
        env:
          STEP_LOG: /tmp/pf_steps.jsonl
        run: python scripts/build_data_status.py

      - name: Validate data integrity (abort commit if corrupt)
        run: python scripts/validate_data.py

      - name: Commit updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: data status refresh + intraday retry (TW) [skip ci]"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              [ "$i" -lt 3 ] && sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::git push failed after 3 attempts"; exit 1; }
          fi

      - name: Data alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/data_alert.py --monitor ${{ job.status == 'failure' && '--job-failed monitor' || '' }}
